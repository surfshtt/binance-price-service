server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: binance-price-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prices_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:changelogs/26-10-price-changelog.xml

  jackson:
    generator:
      write-bigdecimal-as-plain: true

binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}
  symbol: ${BINANCE_SYMBOL:BNBUSDT}
  poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}
  connect-timeout: ${BINANCE_CONNECT_TIMEOUT:PT5S}
  read-timeout: ${BINANCE_READ_TIMEOUT:PT10S}

trend:
  flat-threshold-percent: ${TREND_FLAT_THRESHOLD_PERCENT:0.1}

logging:
  level:
    by.fk8ght: INFO
