services:
  postgres:
    image: postgres:16-alpine
    container_name: prices-postgres
    environment:
      POSTGRES_DB: prices_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - prices-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: prices-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/prices_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      BINANCE_SYMBOL: ${BINANCE_SYMBOL:-BNBUSDT}
      BINANCE_POLL_INTERVAL: ${BINANCE_POLL_INTERVAL:-PT30S}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-https://api.binance.com}
      TREND_FLAT_THRESHOLD_PERCENT: ${TREND_FLAT_THRESHOLD_PERCENT:-0}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  prices-pgdata:
